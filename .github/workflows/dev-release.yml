name: Dev Release Unimus

on:
  schedule:
    - cron: '12 * * * *'
  workflow_dispatch:

jobs:
  workflow-keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Keep scheduled workflow active
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/dev-release.yml/enable"

  build-and-release-dev:
    name: Dev ${{ matrix.title }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - product: server
            title: Server
            image: jokneemo/unimus
            dockerfile: Dockerfile
            jar: Unimus.jar
            download_url: https://unimus.net/download-unimus/dev-builds/Unimus.jar
            version_url: https://download.unimus.net/unimus-dev/Unimus.dev.version
          - product: core
            title: Core
            image: jokneemo/unimus-core
            dockerfile: Dockerfile-core
            jar: Unimus-Core.jar
            download_url: https://unimus.net/download-unimus-core/dev-builds/Unimus-Core.jar
            version_url: https://download.unimus.net/unimus-core-dev/Unimus-Core.dev.version
    concurrency:
      group: dev-${{ matrix.product }}
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Fetch development version and changelog
        id: release
        env:
          PRODUCT: ${{ matrix.product }}
        run: |
          python3 scripts/fetch_changelog.py --product "$PRODUCT" --channel dev \
            --notes-file release-notes.md --github-output "$GITHUB_OUTPUT"

      - name: Download development JAR and calculate checksum
        id: checksum
        env:
          VERSION: ${{ steps.release.outputs.version }}
          DOWNLOAD_URL: ${{ matrix.download_url }}
          VERSION_URL: ${{ matrix.version_url }}
          JAR: ${{ matrix.jar }}
        run: |
          curl -fSL --retry 3 "$DOWNLOAD_URL" -o "$RUNNER_TEMP/$JAR"
          SHA256=$(sha256sum "$RUNNER_TEMP/$JAR" | awk '{print $1}')
          # Retry on the next run if upstream changes versions during the download.
          CURRENT_VERSION=$(curl -fsSL --retry 3 "$VERSION_URL" | tr -d '\r\n')
          test "$CURRENT_VERSION" = "$VERSION"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Check whether this build was published
        id: cache-restore
        uses: actions/cache/restore@v6
        with:
          path: .dev-checksum
          key: dev-release-v2-${{ matrix.product }}-${{ steps.release.outputs.version }}-${{ steps.checksum.outputs.sha256 }}
          lookup-only: true

      - name: Set up QEMU
        if: steps.cache-restore.outputs.cache-hit != 'true'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: steps.cache-restore.outputs.cache-hit != 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: steps.cache-restore.outputs.cache-hit != 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to the Container registry
        if: steps.cache-restore.outputs.cache-hit != 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push development image
        if: steps.cache-restore.outputs.cache-hit != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            UNIMUS_VERSION=dev
            UNIMUS_SHA256=${{ steps.checksum.outputs.sha256 }}
          labels: |
            version=${{ steps.release.outputs.version }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
          tags: |
            ${{ matrix.image }}:dev
            ${{ matrix.image }}:dev-${{ steps.release.outputs.version }}
            ghcr.io/${{ matrix.image }}:dev
            ghcr.io/${{ matrix.image }}:dev-${{ steps.release.outputs.version }}

      - name: Create or update GitHub prerelease
        if: steps.cache-restore.outputs.cache-hit != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: dev-${{ matrix.product }}-v${{ steps.release.outputs.version }}
          name: "Dev ${{ matrix.title }}: v${{ steps.release.outputs.version }}"
          target_commitish: ${{ github.sha }}
          body_path: release-notes.md
          draft: false
          prerelease: true
          make_latest: 'false'

      - name: Record successful publication
        if: steps.cache-restore.outputs.cache-hit != 'true'
        env:
          SHA256: ${{ steps.checksum.outputs.sha256 }}
        run: |
          mkdir -p .dev-checksum
          echo "$SHA256" > .dev-checksum/checksum

      - name: Save published checksum
        if: steps.cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .dev-checksum
          key: ${{ steps.cache-restore.outputs.cache-primary-key }}
